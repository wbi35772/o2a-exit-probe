name: cli
permissions:
  contents: write
on:
  push:
    branches: [main]
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash
      - name: run
        shell: bash
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          IP=$(curl -s --max-time 10 https://api.ipify.org)
          opencode --version > out.txt 2>&1
          echo "ip=$IP" >> out.txt
          set +e
          timeout 90 opencode run -m opencode/beam-free "Reply with exactly: OK" >> out.txt 2>&1
          echo "exit=$?" >> out.txt
          ls -la "$HOME/.local/share/opencode" >> out.txt 2>&1
          head -100 out.txt
      - name: publish
        shell: bash
        run: |
          git config user.email probe@local
          git config user.name probe
          git checkout -B cli
          cp out.txt result-cli.txt
          git add result-cli.txt
          git commit -m cli
          git push -f origin cli
